  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Delta Industries</title>
    <style>
      :root {
        color-scheme: light;
        --gold: #d4af37;
        --gold-dark: #9d7620;
        --charcoal: #171512;
        --ink: #27231c;
        --muted: #716854;
        --paper: #f7f3ea;
        --panel: rgba(255, 252, 244, 0.92);
        --line: rgba(157, 118, 32, 0.22);
        --shadow: 0 28px 70px rgba(38, 31, 18, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          linear-gradient(135deg, rgba(212, 175, 55, 0.16), transparent 32%),
          linear-gradient(315deg, rgba(23, 21, 18, 0.08), transparent 34%),
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.92), transparent 44%),
          var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        letter-spacing: 0;
        overflow-x: hidden;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        content: "";
        background-image:
          linear-gradient(rgba(157, 118, 32, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(157, 118, 32, 0.045) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
        opacity: 0.5;
      }

      .visit-page {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 40px 20px;
      }

      .ambient-awards {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .floating-award {
        position: absolute;
        width: clamp(58px, 5.4vw, 92px);
        height: auto;
        color: rgba(157, 118, 32, 0.38);
        filter: drop-shadow(0 16px 22px rgba(65, 49, 20, 0.1));
        opacity: 0.72;
        transform: rotate(var(--rotate));
        animation: award-float var(--duration) ease-in-out infinite;
      }

      .floating-award path,
      .floating-award circle,
      .floating-award line,
      .floating-award polyline {
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .floating-award .soft-fill {
        fill: rgba(212, 175, 55, 0.08);
        stroke: none;
      }

      .award-1 {
        --rotate: -8deg;
        --duration: 8.8s;
        left: clamp(18px, 4.3vw, 68px);
        top: 17%;
      }

      .award-2 {
        --rotate: 7deg;
        --duration: 10.5s;
        left: clamp(14px, 4.2vw, 62px);
        bottom: 18%;
        width: clamp(42px, 3.8vw, 62px);
        animation-delay: -3.8s;
      }

      .award-3 {
        --rotate: 13deg;
        --duration: 12s;
        left: clamp(8px, 3.4vw, 54px);
        bottom: 41%;
        width: clamp(36px, 3.4vw, 58px);
        opacity: 0.42;
        animation-delay: -6.2s;
      }

      .award-4 {
        --rotate: 8deg;
        --duration: 9.6s;
        right: clamp(18px, 4.3vw, 68px);
        top: 19%;
        animation-delay: -2.6s;
      }

      .award-5 {
        --rotate: -9deg;
        --duration: 11.2s;
        right: clamp(14px, 4.2vw, 62px);
        bottom: 17%;
        width: clamp(42px, 3.8vw, 62px);
        animation-delay: -5.4s;
      }

      .award-6 {
        --rotate: -14deg;
        --duration: 12.8s;
        right: clamp(8px, 3.5vw, 58px);
        bottom: 42%;
        width: clamp(36px, 3.4vw, 58px);
        opacity: 0.42;
        animation-delay: -7.2s;
      }

      @keyframes award-float {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(var(--rotate));
        }

        50% {
          transform: translate3d(0, -18px, 0) rotate(calc(var(--rotate) + 2deg));
        }
      }

      .visit-card {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(280px, 0.88fr) minmax(340px, 1.12fr);
        width: min(100%, 980px);
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(255, 250, 239, 0.9)),
          var(--panel);
        border: 1px solid rgba(157, 118, 32, 0.26);
        border-radius: 12px;
        box-shadow:
          0 34px 80px rgba(38, 31, 18, 0.17),
          0 12px 28px rgba(157, 118, 32, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
      }

      .visit-card::before {
        position: absolute;
        inset: 0 0 auto;
        z-index: 3;
        height: 4px;
        content: "";
        background: linear-gradient(
          90deg,
          transparent,
          rgba(212, 175, 55, 0.42),
          rgba(157, 118, 32, 0.7),
          rgba(212, 175, 55, 0.42),
          transparent
        );
      }

      .visit-card::after {
        position: absolute;
        inset: 1px;
        z-index: 0;
        pointer-events: none;
        content: "";
        border-radius: 11px;
        background:
          radial-gradient(circle at 23% 18%, rgba(212, 175, 55, 0.14), transparent 28%),
          radial-gradient(circle at 78% 84%, rgba(157, 118, 32, 0.08), transparent 30%);
      }

      .brand-panel {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 560px;
        padding: 42px 36px;
        overflow: hidden;
        text-align: center;
        background:
          radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.2), transparent 33%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(247, 241, 226, 0.94)),
          linear-gradient(135deg, rgba(212, 175, 55, 0.2), transparent 50%);
        border-right: 1px solid var(--line);
      }

      .brand-panel::before,
      .brand-panel::after {
        position: absolute;
        inset: 22px;
        pointer-events: none;
        content: "";
        border: 1px solid rgba(157, 118, 32, 0.18);
        border-radius: 8px;
        box-shadow:
          inset 0 0 28px rgba(212, 175, 55, 0.06),
          0 1px 0 rgba(255, 255, 255, 0.66);
      }

      .brand-panel::after {
        inset: auto 42px 34px;
        height: 1px;
        border: 0;
        background: linear-gradient(90deg, transparent, rgba(157, 118, 32, 0.5), transparent);
      }

      .brand-mark {
        position: relative;
        z-index: 1;
        display: block;
        width: 220px;
        max-width: 68%;
        height: auto;
        margin: 0 auto 30px;
        filter:
          drop-shadow(0 24px 38px rgba(38, 31, 18, 0.24))
          drop-shadow(0 0 16px rgba(212, 175, 55, 0.14));
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        color: var(--charcoal);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 4vw, 3.15rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
        text-shadow: 0 8px 18px rgba(38, 31, 18, 0.08);
      }

      h1::after {
        display: block;
        width: 112px;
        height: 2px;
        margin: 18px auto 0;
        content: "";
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .tagline {
        position: relative;
        z-index: 1;
        max-width: 390px;
        margin: 16px auto 0;
        color: var(--muted);
        font-size: 1.04rem;
        font-weight: 500;
        line-height: 1.65;
      }

      .action-panel {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 560px;
        padding: 50px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 252, 244, 0.94)),
          radial-gradient(circle at 100% 0%, rgba(212, 175, 55, 0.1), transparent 30%),
          var(--panel);
      }

      .action-panel::before {
        position: absolute;
        inset: 50px auto 50px 0;
        width: 1px;
        content: "";
        background: linear-gradient(180deg, transparent, rgba(157, 118, 32, 0.28), transparent);
      }

      .button-list {
        display: grid;
        gap: 15px;
      }

      .premium-button {
        position: relative;
        display: grid;
        grid-template-columns: 46px 1fr 22px;
        align-items: center;
        min-height: 68px;
        padding: 0 20px;
        overflow: hidden;
        color: var(--charcoal);
        text-decoration: none;
        background:
          linear-gradient(90deg, rgba(212, 175, 55, 0.13), transparent 18%),
          linear-gradient(180deg, #ffffff, rgba(255, 252, 244, 0.88));
        border: 1px solid rgba(157, 118, 32, 0.28);
        border-radius: 8px;
        box-shadow:
          0 14px 28px rgba(38, 31, 18, 0.09),
          0 4px 12px rgba(157, 118, 32, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.96),
          inset 3px 0 0 rgba(212, 175, 55, 0.34);
        font-size: 1.02rem;
        font-weight: 720;
        touch-action: manipulation;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease,
          background 180ms ease;
      }

      .premium-button::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        background:
          linear-gradient(90deg, rgba(212, 175, 55, 0.2), transparent 38%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.34), transparent 52%);
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .premium-button::after {
        justify-self: end;
        width: 9px;
        height: 9px;
        content: "";
        border-top: 2px solid var(--gold-dark);
        border-right: 2px solid var(--gold-dark);
        transform: rotate(45deg);
      }

      .premium-button:hover,
      .premium-button:focus-visible {
        background: #fff;
        border-color: rgba(157, 118, 32, 0.52);
        box-shadow:
          0 18px 38px rgba(38, 31, 18, 0.13),
          0 0 0 4px rgba(212, 175, 55, 0.13),
          inset 3px 0 0 rgba(212, 175, 55, 0.62);
        outline: none;
        transform: translateY(-2px);
      }

      .premium-button:hover::before,
      .premium-button:focus-visible::before {
        opacity: 1;
      }

      .premium-button.is-placeholder {
        opacity: 0.58;
      }

      .premium-button.is-placeholder:hover,
      .premium-button.is-placeholder:focus-visible {
        transform: none;
      }

      .button-icon {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        color: var(--gold-dark);
        background:
          radial-gradient(circle at 35% 25%, #fff, #fbf1d4 72%);
        border: 1px solid rgba(157, 118, 32, 0.22);
        border-radius: 999px;
        box-shadow:
          0 8px 18px rgba(157, 118, 32, 0.09),
          inset 0 1px 0 rgba(255, 255, 255, 0.92);
      }

      .button-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .button-text {
        position: relative;
        z-index: 1;
        padding: 0 14px;
      }

      @media (max-width: 780px) {
        .ambient-awards {
          display: none;
        }

        .visit-page {
          align-items: start;
          min-height: 100svh;
          padding: max(12px, env(safe-area-inset-top)) 12px
            max(12px, env(safe-area-inset-bottom));
        }

        .visit-card {
          grid-template-columns: 1fr;
          width: min(100%, 390px);
          border-radius: 14px;
          box-shadow:
            0 22px 48px rgba(38, 31, 18, 0.14),
            0 8px 18px rgba(157, 118, 32, 0.08),
            inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .visit-card::before {
          height: 3px;
        }

        .visit-card::after {
          border-radius: 13px;
        }

        .brand-panel {
          min-height: auto;
          padding: 24px 18px 20px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .brand-panel::before {
          inset: 10px;
          border-radius: 10px;
        }

        .brand-panel::after {
          display: none;
        }

        .brand-mark {
          width: 118px;
          margin-bottom: 14px;
        }

        h1 {
          font-size: clamp(1.62rem, 8vw, 1.95rem);
          line-height: 0.98;
        }

        h1::after {
          width: 78px;
          height: 1px;
          margin-top: 11px;
        }

        .tagline {
          max-width: 300px;
          margin-top: 10px;
          font-size: 0.86rem;
          line-height: 1.45;
        }

        .action-panel {
          min-height: auto;
          padding: 16px 16px 18px;
        }

        .button-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .premium-button {
          display: flex;
          flex-direction: column;
          justify-content: center;
          min-height: 0;
          aspect-ratio: 1 / 1;
          padding: 12px 8px;
          border-radius: 10px;
          font-size: 0.9rem;
          line-height: 1.18;
          box-shadow:
            0 10px 20px rgba(38, 31, 18, 0.08),
            0 3px 8px rgba(157, 118, 32, 0.05),
            inset 0 1px 0 rgba(255, 255, 255, 0.96),
            inset 2px 0 0 rgba(212, 175, 55, 0.28);
        }

        .premium-button::after {
          position: absolute;
          right: 11px;
          bottom: 11px;
          width: 7px;
          height: 7px;
        }

        .button-icon {
          width: 38px;
          height: 38px;
          margin-bottom: 9px;
        }

        .button-icon svg {
          width: 17px;
          height: 17px;
        }

        .button-text {
          padding: 0 6px;
          text-align: center;
        }
      }

      @media (max-width: 360px) {
        .visit-page {
          padding-right: 10px;
          padding-left: 10px;
        }

        .visit-card {
          width: min(100%, 340px);
        }

        .brand-panel {
          padding: 22px 15px 18px;
        }

        .brand-mark {
          width: 106px;
          margin-bottom: 12px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .tagline {
          font-size: 0.8rem;
        }

        .action-panel {
          padding: 14px;
        }

        .button-list {
          gap: 9px;
        }

        .premium-button {
          font-size: 0.82rem;
        }

        .button-icon {
          width: 34px;
          height: 34px;
          margin-bottom: 8px;
        }
      }

      @media (max-width: 780px) and (max-height: 760px) {
        .brand-panel {
          padding-top: 20px;
          padding-bottom: 17px;
        }

        .brand-mark {
          width: 100px;
          margin-bottom: 11px;
        }

        h1 {
          font-size: 1.46rem;
        }

        h1::after {
          margin-top: 9px;
        }

        .tagline {
          margin-top: 8px;
          font-size: 0.78rem;
          line-height: 1.38;
        }

        .action-panel {
          padding-top: 14px;
          padding-bottom: 14px;
        }

        .button-list {
          gap: 9px;
        }

        .premium-button {
          font-size: 0.82rem;
        }

        .button-icon {
          width: 33px;
          height: 33px;
          margin-bottom: 7px;
        }
      }

      @media (min-width: 781px) and (max-width: 1120px) {
        .floating-award {
          opacity: 0.34;
          width: clamp(42px, 4vw, 62px);
        }

        .award-3,
        .award-6 {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .floating-award {
          animation: none;
        }
      }
    </style>

    <script>
      const links = window.deltaIndustriesLinks || {};

      document.querySelectorAll("[data-link]").forEach((button) => {
        const value = links[button.dataset.link] || "";

        if (!value) {
          button.classList.add("is-placeholder");
          button.setAttribute("aria-disabled", "true");
          return;
        }

        button.href = value;

        if (/^https?:\/\//i.test(value)) {
          button.target = "_blank";
          button.rel = "nofollow noopener";
        }
      });

      document.addEventListener("click", (event) => {
        const placeholder = event.target.closest("[aria-disabled='true']");

        if (placeholder) {
          event.preventDefault();
        }
      });
    </script>
